    <script>
      // Restores the path stashed by 404.html's GitHub Pages SPA redirect.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectedPath = params.get("p");
        if (redirectedPath) {
          var restored =
            window.location.pathname.replace(/\/$/, "") +
            redirectedPath +
            (params.get("q") ? "?" + params.get("q").replace(/~and~/g, "&") : "") +
            window.location.hash;
          window.history.replaceState(null, "", restored.replace(/~and~/g, "&"));
        }
      })();
    </script>

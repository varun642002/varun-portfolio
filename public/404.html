<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Varun S.</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct load of
      // /work/:slug 404s. This stashes the path and redirects to the app
      // shell, which restores it below.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?p=/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
